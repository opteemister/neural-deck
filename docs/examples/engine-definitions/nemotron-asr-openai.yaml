version: 1
id: nemotron-asr-openai
name: Nemotron 3.5 ASR OpenAI Transcriptions adapter (experimental)
types: [asr]
install_script: |
  set -eu
  target={{target}}
  python3 -m venv "$target"
  "$target/bin/pip" install -r /opt/neural-deck/backend/app/serving/requirements/nemotron-asr.txt
  install -m 0644 /opt/neural-deck/backend/app/serving/nemotron_asr_openai.py "$target/nemotron_asr_openai.py"
  cat > "$target/bin/nemotron-asr-openai" <<'SCRIPT'
  #!/bin/sh
  exec "$(dirname "$0")/python" "$(dirname "$0")/../nemotron_asr_openai.py" "$@"
  SCRIPT
  chmod 0755 "$target/bin/nemotron-asr-openai"
update_script: null
executable: "{{target}}/bin/nemotron-asr-openai"
working_directory: null
environment: {}
command: "{{engine}} --model {{model}} --model-name {{model_name}} --host 127.0.0.1 --port 18102"
healthcheck:
  path: /health
  timeout_seconds: 3
api:
  protocol: openai
  base_url: http://127.0.0.1:18102/v1
ui_url: null
version_command: null
