version: 1
id: ninfer
name: NInfer
types: [text]
install_script_file: ninfer.sh
executable: "{{target}}/bin/ninfer-serve"
environment: {}
command: "{{engine}} {{model}} --model-id {{model_name}} --host 127.0.0.1 --port 8000"
healthcheck:
  path: /v1/models
  timeout_seconds: 3
api:
  protocol: openai
  base_url: http://127.0.0.1:8000/v1
