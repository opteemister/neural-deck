version: 1
id: sglang
name: SGLang
types: [text]
install_script_file: sglang.sh
update_script_file: sglang.update.sh
executable: "{{target}}/bin/sglang"
working_directory: "{{target}}"
environment: {}
command: "{{engine}} serve --model-path {{model}} --served-model-name {{model_name}} --enable-metrics --host 127.0.0.1 --port 8000"
healthcheck:
  path: /v1/models
  timeout_seconds: 3
api:
  protocol: openai
  base_url: http://127.0.0.1:8000/v1
