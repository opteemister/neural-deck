services:
  app:
    build:
      # Only image-owned files enter the build context.  Application source,
      # persistent data, and the populated root .env are bind-mounted at run
      # time and therefore never get sent to the Docker daemon.
      context: ./docker
      dockerfile: Dockerfile
    working_dir: /workspace
    env_file:
      # This tracked file makes a fresh checkout predictable for local Docker
      # runs. A populated root `.env`, when present, is an explicit runtime
      # override and is never copied into the image.
      - path: .env.local
        required: true
      - path: .env
        required: false
    environment:
      # These are container mechanics, not application runtime defaults. The
      # required application values come from .env.local/.env above.
      LLM_STUDIO_WORKSPACE: /workspace
      LLM_STUDIO_BACKEND_DIR: /workspace/backend
      LLM_STUDIO_FRONTEND_DIR: /workspace/frontend
      LLM_STUDIO_BACKEND_PORT: 8000
      LLM_STUDIO_FRONTEND_PORT: 5173
      # The entrypoint rejects runtime paths outside these actual persistent
      # mount targets before it starts any application process.
      LLM_STUDIO_PERSISTENT_ROOTS: /var/lib/llm-studio:/var/log/llm-studio
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/workspace
      # The source variables are Compose-only. Runtime values in .env.local or
      # .env stay absolute paths inside the container and are checked against
      # these targets by docker/entrypoint.sh.
      - type: bind
        source: ${LLM_STUDIO_COMPOSE_DATA_SOURCE:-./data}
        target: /var/lib/llm-studio
      - type: bind
        source: ${LLM_STUDIO_COMPOSE_MODELS_SOURCE:-./models}
        target: /var/lib/llm-studio/models
      - type: bind
        source: ${LLM_STUDIO_COMPOSE_LOG_SOURCE:-./logs}
        target: /var/lib/llm-studio/logs
      - type: bind
        source: ${LLM_STUDIO_COMPOSE_LOG_SOURCE:-./logs}
        target: /var/log/llm-studio
    init: true
