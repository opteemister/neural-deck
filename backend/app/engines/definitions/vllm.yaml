version: 1
id: vllm
name: vLLM
types: [text]
install_script_file: vllm.sh
update_script_file: vllm.update.sh
executable: "{{target}}/bin/vllm"
working_directory: "{{target}}"
environment: {}
command: "{{engine}} serve {{model}} --served-model-name {{model_name}} --host 127.0.0.1 --port 8000"
healthcheck:
  path: /v1/models
  timeout_seconds: 3
api:
  protocol: openai
  base_url: http://127.0.0.1:8000/v1
