[project]
name = "llm-studio-backend"
version = "0.1.0"
description = "Async FastAPI backend for the LLM Studio local model dashboard."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.4",
    "aiosqlite==0.21.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "pydantic-settings==2.10.1",
    "sqlalchemy[asyncio]==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["^alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
