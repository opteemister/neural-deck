user nobody;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream llm_studio_backend {
        server 127.0.0.1:8000;
    }

    upstream llm_studio_frontend {
        server 127.0.0.1:5173;
    }

    server {
        listen 3000;
        server_name _;

        # API and health requests go to FastAPI. Keep the trailing slash out
        # of proxy_pass so the application receives the original path.
        location ~ ^/(api|v1|mcp)(/|$) {
            proxy_pass http://llm_studio_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location = /health {
            proxy_pass http://llm_studio_backend/api/v1/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /docs {
            proxy_pass http://llm_studio_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            proxy_pass http://llm_studio_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Vite's development server provides the UI and HMR websocket.
        location / {
            proxy_pass http://llm_studio_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
