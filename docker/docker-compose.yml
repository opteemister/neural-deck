# LOCAL mode: one container where FastAPI serves the frontend build.
# The source tree and SQLite data are bind-mounted for local development.
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /workspace
    env_file:
      - ../.env.local
    volumes:
      - ..:/workspace
      - backend_venv:/workspace/backend/.venv
      - frontend_node_modules:/workspace/frontend/node_modules
      - ../data:/workspace/data
    ports:
      - "127.0.0.1:3000:3000"
    command: ["bash", "/workspace/scripts/start_local.sh"]

volumes:
  backend_venv:
  frontend_node_modules:
