name: neural-deck

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VLLM_VERSION: "0.11.2"
        LLAMA_CPP_VERSION: "b5046"
    working_dir: /workspace
    env_file:
      # Local Docker uses only local settings. Production .env is excluded.
      - path: .env.local
        required: true
    environment:
      # These are container mechanics, not application runtime defaults. The
      # required application values come from .env.local above.
      NEURAL_DECK_WORKSPACE: /workspace
      NEURAL_DECK_BACKEND_DIR: /workspace/backend
      NEURAL_DECK_FRONTEND_DIR: /workspace/frontend
      # Local Compose keeps the image-built frontend and rebuilds it only
      # after a source change. Production containers leave this disabled.
      NEURAL_DECK_FRONTEND_WATCH: "1"
      # Local backend development also reloads the Python application when
      # files under backend/app change. The command is evaluated inside the
      # container by docker/entrypoint.sh; the doubled dollar signs keep HOST
      # and PORT for that shell instead of expanding them in Compose.
      NEURAL_DECK_BACKEND_DEV_COMMAND: >-
        exec /workspace/backend/.venv/bin/uvicorn app.main:app
        --app-dir /workspace/backend
        --host "$${HOST}"
        --port "$${PORT}"
        --reload
        --reload-dir /workspace/backend/app
      # The entrypoint rejects runtime paths outside these actual persistent
      # mount targets before it starts any application process.
      NEURAL_DECK_PERSISTENT_ROOTS: /var/lib/neural-deck:/var/log/neural-deck
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8080:8080"
    volumes:
      # Only live source folders are overlaid. Dependencies and the initial
      # frontend build are part of the image and never come from macOS.
      - ./backend/app:/workspace/backend/app
      - ./backend/alembic:/workspace/backend/alembic
      - ./frontend/src:/workspace/frontend/src
      # Fixed local bind sources keep production dotenv interpolation from
      # redirecting Docker mounts. Runtime paths come only from .env.local and
      # are checked against these targets by docker/entrypoint.sh.
      - type: bind
        source: ./data
        target: /var/lib/neural-deck
      - type: bind
        source: ./models
        target: /var/lib/neural-deck/models
      - type: bind
        source: ./logs
        target: /var/lib/neural-deck/logs
      - type: bind
        source: ./logs
        target: /var/log/neural-deck
    init: true
